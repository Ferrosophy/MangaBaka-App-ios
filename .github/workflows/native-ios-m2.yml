name: Native iOS M3
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: native-m3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: native-ios
    steps:
    - uses: actions/checkout@v4
    - name: Capture live API samples
      run: python3 scripts/capture_api.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Native-M3-API-validation
        path: native-ios/api-validation.json
        if-no-files-found: ignore
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: Native-M3-fixtures
        path: native-ios/Sources/Fixtures/
        if-no-files-found: error
        retention-days: 14
  build-ipa:
    needs: api
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: native-ios
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - uses: actions/download-artifact@v4
      with:
        name: Native-M3-fixtures
        path: native-ios/Sources/Fixtures
    - name: Generate Xcode project
      run: 'brew install xcodegen

        python3 -m venv /tmp/m3-config-venv

        /tmp/m3-config-venv/bin/pip -q install PyYAML

        /tmp/m3-config-venv/bin/python scripts/configure_oauth.py

        xcodegen generate

        '
      env:
        MANGABAKA_CLIENT_ID: ${{ vars.MANGABAKA_APP_CLIENT_ID }}
        MANGABAKA_REDIRECT_URI: ${{ vars.MANGABAKA_APP_REDIRECT_URI }}
        ENV_FILE: ${{ secrets.ENV_FILE }}
    - name: Build unsigned Release
      run: "set -euo pipefail\nxcodebuild build -project MangaBakaNative.xcodeproj\
        \ -scheme MangaBakaNative -configuration Release -sdk iphoneos -destination\
        \ 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO\n\
        APP=build/Build/Products/Release-iphoneos/MangaBakaNative.app\nlipo \"$APP/MangaBakaNative\"\
        \ -verify_arch arm64\nmkdir -p staging/Payload dist\ncp -R \"$APP\" staging/Payload/\n\
        (cd staging && zip -qry ../dist/MangaBaka-Native-M3-unsigned.ipa Payload)\n\
        unzip -tq dist/MangaBaka-Native-M3-unsigned.ipa\n(cd dist && shasum -a 256\
        \ *.ipa > SHA256SUMS)\necho \"Source: $GITHUB_SHA\" > dist/build-info.txt\n\
        xcodebuild -version >> dist/build-info.txt\n\npython3 - <<'PYINFO' >> dist/build-info.txt\n\
        import plistlib\nwith open('build/Build/Products/Release-iphoneos/MangaBakaNative.app/Info.plist',\
        \ 'rb') as f:\n    info = plistlib.load(f)\nprint('OAuth client configured:',\
        \ bool(info.get('MangaBakaClientID')))\nprint('Real account/device verification:\
        \ requires user authorization; not covered by mock tests')\nPYINFO\n"
    - uses: actions/upload-artifact@v4
      with:
        name: MangaBaka-Native-M3-IPA
        path: native-ios/dist/
        if-no-files-found: error
        retention-days: 14
  test:
    needs: api
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: native-ios
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - uses: actions/download-artifact@v4
      with:
        name: Native-M3-fixtures
        path: native-ios/Sources/Fixtures
    - name: Generate Xcode project
      run: 'brew install xcodegen

        python3 -m venv /tmp/m3-config-venv

        /tmp/m3-config-venv/bin/pip -q install PyYAML

        /tmp/m3-config-venv/bin/python scripts/configure_oauth.py

        xcodegen generate

        '
      env:
        MANGABAKA_CLIENT_ID: ${{ vars.MANGABAKA_APP_CLIENT_ID }}
        MANGABAKA_REDIRECT_URI: ${{ vars.MANGABAKA_APP_REDIRECT_URI }}
        ENV_FILE: ${{ secrets.ENV_FILE }}
    - name: Boot a fresh iPhone simulator
      timeout-minutes: 7
      run: "set -euo pipefail\npython3 <<'PYBOOT'\nimport json, os, subprocess\nruntimes\
        \ = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes',\
        \ '-j']))['runtimes']\nsupported = [r for r in runtimes if r.get('isAvailable')\
        \ and r['identifier'].split('.')[-1].startswith('iOS-26')]\nruntime = max(supported,\
        \ key=lambda r: tuple(map(int, r['version'].split('.'))))\ntypes = json.loads(subprocess.check_output(['xcrun',\
        \ 'simctl', 'list', 'devicetypes', '-j']))['devicetypes']\ndevice_type = next(t['identifier']\
        \ for t in types if t['name'] == 'iPhone 17 Pro')\ndevice = subprocess.check_output(['xcrun',\
        \ 'simctl', 'create', 'M3 Review', device_type, runtime['identifier']], text=True).strip()\n\
        print('Using', runtime['name'], device, flush=True)\nsubprocess.run(['xcrun',\
        \ 'simctl', 'boot', device], check=True)\nsubprocess.run(['xcrun', 'simctl',\
        \ 'bootstatus', device, '-b'], check=True, timeout=300)\nwith open(os.environ['GITHUB_ENV'],\
        \ 'a') as f:\n    f.write('M3_SIMULATOR=' + device + '\\n')\nPYBOOT\n"
    - name: Test on iPhone simulator
      timeout-minutes: 15
      run: 'set -euo pipefail

        xcodebuild test -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance
        120 -maximum-test-execution-time-allowance 180 -project MangaBakaNative.xcodeproj
        -scheme MangaBakaNative -destination "platform=iOS Simulator,id=$M3_SIMULATOR"
        -destination-timeout 90 -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO

        '
    - name: Export review screenshots
      if: always()
      run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path
        screenshots || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Native-M3-review-screenshots
        path: native-ios/screenshots/
        if-no-files-found: ignore
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Native-M3-test-results
        path: native-ios/TestResults.xcresult
        if-no-files-found: ignore
        retention-days: 7

name: Native iOS M2
on:
  workflow_dispatch:
  push:
    branches: [feature/native-ios-m2]
    paths: ['native-ios/**', '.github/workflows/native-ios-m2.yml']
permissions:
  contents: read
concurrency:
  group: native-m2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: native-ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Capture live API samples
        run: python3 scripts/capture_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-M2-API-validation
          path: |
            native-ios/api-validation.json
            native-ios/Sources/Fixtures/
          if-no-files-found: ignore
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test on iPhone simulator
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS-26" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild test -parallel-testing-enabled NO -project MangaBakaNative.xcodeproj -scheme MangaBakaNative -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Export review screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-M2-review-screenshots
          path: native-ios/screenshots/
          if-no-files-found: ignore
      - name: Build unsigned Release
        run: |
          set -euo pipefail
          xcodebuild build -project MangaBakaNative.xcodeproj -scheme MangaBakaNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          APP=build/Build/Products/Release-iphoneos/MangaBakaNative.app
          lipo "$APP/MangaBakaNative" -verify_arch arm64
          mkdir -p staging/Payload dist
          cp -R "$APP" staging/Payload/
          (cd staging && zip -qry ../dist/MangaBaka-Native-M2-unsigned.ipa Payload)
          unzip -tq dist/MangaBaka-Native-M2-unsigned.ipa
          (cd dist && shasum -a 256 *.ipa > SHA256SUMS)
          echo "Source: $GITHUB_SHA" > dist/build-info.txt
          xcodebuild -version >> dist/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MangaBaka-Native-M2-IPA
          path: native-ios/dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-M2-test-results
          path: native-ios/TestResults.xcresult
          if-no-files-found: ignore

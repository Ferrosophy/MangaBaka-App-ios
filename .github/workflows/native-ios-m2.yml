name: Native iOS M2
on:
  workflow_dispatch:
  push:
    branches: [feature/native-ios-m2]
    paths: ['native-ios/**', '.github/workflows/native-ios-m2.yml']
permissions:
  contents: read
concurrency:
  group: native-m2-macos15-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: native-ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Capture live API samples
        run: python3 scripts/capture_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-M2-API-validation
          path: |
            native-ios/api-validation.json
            native-ios/Sources/Fixtures/
          if-no-files-found: ignore
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Boot a fresh iPhone simulator
        timeout-minutes: 7
        run: |
          set -euo pipefail
          python3 <<'PYBOOT'
          import json, os, subprocess
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '-j']))['runtimes']
          supported = [r for r in runtimes if r.get('isAvailable') and r['identifier'].split('.')[-1].startswith('iOS-26')]
          runtime = max(supported, key=lambda r: tuple(map(int, r['version'].split('.'))))
          types = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devicetypes', '-j']))['devicetypes']
          device_type = next(t['identifier'] for t in types if t['name'] == 'iPhone 17 Pro')
          device = subprocess.check_output(['xcrun', 'simctl', 'create', 'M2 Review', device_type, runtime['identifier']], text=True).strip()
          print('Using', runtime['name'], device, flush=True)
          subprocess.run(['xcrun', 'simctl', 'boot', device], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device, '-b'], check=True, timeout=300)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('M2_SIMULATOR=' + device + '\n')
          PYBOOT
      - name: Test on iPhone simulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          xcodebuild test -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -project MangaBakaNative.xcodeproj -scheme MangaBakaNative -destination "platform=iOS Simulator,id=$M2_SIMULATOR" -destination-timeout 90 -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Export review screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-M2-review-screenshots
          path: native-ios/screenshots/
          if-no-files-found: ignore
      - name: Build unsigned Release
        run: |
          set -euo pipefail
          xcodebuild build -project MangaBakaNative.xcodeproj -scheme MangaBakaNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          APP=build/Build/Products/Release-iphoneos/MangaBakaNative.app
          lipo "$APP/MangaBakaNative" -verify_arch arm64
          mkdir -p staging/Payload dist
          cp -R "$APP" staging/Payload/
          (cd staging && zip -qry ../dist/MangaBaka-Native-M2-unsigned.ipa Payload)
          unzip -tq dist/MangaBaka-Native-M2-unsigned.ipa
          (cd dist && shasum -a 256 *.ipa > SHA256SUMS)
          echo "Source: $GITHUB_SHA" > dist/build-info.txt
          xcodebuild -version >> dist/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MangaBaka-Native-M2-IPA
          path: native-ios/dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-M2-test-results
          path: native-ios/TestResults.xcresult
          if-no-files-found: ignore

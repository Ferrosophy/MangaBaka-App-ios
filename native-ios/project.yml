name: MangaBakaNative
options:
  bundleIdPrefix: dev.ferrosophy
  deploymentTarget:
    iOS: '26.0'
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: false
    MARKETING_VERSION: 0.4.1
    CURRENT_PROJECT_VERSION: '5'
targets:
  MangaBakaNative:
    type: application
    platform: iOS
    sources:
    - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ferrosophy.mangabaka.native
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: MangaBaka Native
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  MangaBakaNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests
    dependencies:
    - target: MangaBakaNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  MangaBakaNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - UITests
    dependencies:
    - target: MangaBakaNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  MangaBakaNative:
    build:
      targets:
        MangaBakaNative: all
    test:
      targets:
      - MangaBakaNativeTests
      - MangaBakaNativeUITests
